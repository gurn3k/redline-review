<!doctype html>
<!--
  Source for app/opengraph-image.png, the 1200×630 link-preview image.
  Copy is the landing page hero (app/page.tsx); update both together.
  Render with Chrome:
    chrome --headless=new --hide-scrollbars --force-device-scale-factor=1 \
      --window-size=1200,630 --virtual-time-budget=3000 \
      --screenshot=app/opengraph-image.png scripts/share-card.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,600&display=block">
<style>
  * { box-sizing: border-box; margin: 0; }
  body { width: 1200px; height: 630px; background: #f7f4ee; color: #1c1917; font-family: "Instrument Sans", system-ui, sans-serif; position: relative; overflow: hidden; }
  .bar { position: absolute; left: 0; right: 0; top: 0; height: 104px; display: flex; align-items: center; gap: 18px; padding: 0 80px; border-bottom: 1px solid #e7e1d6; }
  .bar::before, .bar::after { content: ""; height: 2px; background: #8f1d22; }
  .bar::before { width: 62px; margin-left: -80px; }
  .bar::after { flex: 1; margin-right: -80px; }
  .brand { display: flex; align-items: center; gap: 14px; font-family: "Newsreader", Georgia, serif; font-weight: 600; font-size: 34px; letter-spacing: -0.01em; }
  .brand svg { width: 40px; height: 40px; }
  .main { position: absolute; left: 80px; top: 156px; width: 1040px; }
  .eyebrow { color: #8f1d22; font-size: 18px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; }
  h1 { margin-top: 22px; font-family: "Newsreader", Georgia, serif; font-weight: 600; font-size: 92px; line-height: 1.02; letter-spacing: -0.025em; }
  h1 em { font-style: normal; color: #8f1d22; }
  .lede { margin-top: 30px; font-size: 27px; line-height: 1.4; color: #44403c; }
  .byline { position: absolute; left: 80px; bottom: 48px; font-size: 19px; color: #78716c; }
</style>
</head>
<body>
  <div class="bar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#8f1d22"/><path fill="#fffdf9" fill-rule="evenodd" d="M8 6.5H17.5A5.75 5.75 0 0 1 17.5 18H14V25.5H8ZM14 11V13.5H17A1.25 1.25 0 0 0 17 11Z"/><path fill="#fffdf9" d="M15.5 16.5H21.5L25 25.5H18.5Z"/></svg>
      Redline
    </div>
  </div>
  <div class="main">
    <p class="eyebrow">Contract review for small business owners</p>
    <h1>Know what you’re signing <em>before</em> you sign it.</h1>
    <p class="lede">Every flag shows the exact sentence it came from.</p>
  </div>
  <p class="byline">Built by Gurnek Khaira</p>
</body>
</html>
